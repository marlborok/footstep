<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<!-- 地球貼圖 earth-8k.jpg：© Solar System Scope (solarsystemscope.com/textures)，授權 CC BY 4.0，已調整亮度。 -->
<meta name="credits" content="Earth texture © Solar System Scope, CC BY 4.0">
<link rel="preload" as="image" href="./earth-8k.jpg">
<style>
  :root{--ink:#e9eef8;--mut:#828da4;--line:rgba(255,255,255,.10);
    --grad:linear-gradient(120deg,#ffd166 0%,#f5a622 55%,#e07b2c 100%);
    --glass:rgba(146,166,204,.10);--glass2:rgba(150,170,208,.14);
    --gshadow:0 16px 42px rgba(0,0,0,.5);--ghi:inset 0 1px 0 rgba(255,255,255,.14);
    --stroke:rgba(255,255,255,.12);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;
    color:var(--ink);font-family:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-user-select:none;user-select:none;}
  /* 背景與星空改掛在超出視窗邊界的固定層。
     掛在 html/body 上只會覆蓋「版面視窗」，iOS 工具列收合後可視高度變大，
     多出來的區域構不到就會露出一條死板色塊。上下各外擴 16vh 即可永遠滿版。 */
  #bg,#stars{position:fixed;left:0;right:0;top:-16vh;bottom:-16vh;z-index:0;pointer-events:none;}
  #bg{background:
     radial-gradient(70% 38% at 15% 20%, rgba(72,96,170,.30) 0%, transparent 60%),
     radial-gradient(65% 38% at 88% 24%, rgba(150,90,180,.20) 0%, transparent 58%),
     radial-gradient(90% 45% at 50% 82%, rgba(224,123,44,.16) 0%, transparent 62%),
     linear-gradient(170deg,#080b14 0%,#0c101d 45%,#0a0d18 100%);}
  /* 必須寫在 background 簡寫之後（簡寫會把 background-color 重設為透明）。
     根元素的背景「顏色」會塗滿整個視窗畫布，但背景「圖片」（漸層）只塗滿 html 自己的盒子；
     iOS Safari 工具列收合後可視高度大於 100%，多出來那塊沒有漸層就露出預設白底。 */
  html{background-color:#080b14;}
  /* 版面高度改用動態視窗單位，工具列收合時才不會少一截 */
  @supports (height:100dvh){html,body{height:100dvh;}}
  /* z0 星空層（JS 產生一次貼圖後鋪滿） */
  #stars{opacity:.75;}
  /* z0 地球後方光暈：冷色，像大氣在太空中的散射 */
  #halo{position:fixed;left:50%;top:calc(50% - 7vh);transform:translate(-50%,-50%);z-index:0;
    width:min(112vw,620px);aspect-ratio:1;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(96,168,255,.20) 0%,rgba(80,130,240,.09) 46%,transparent 72%);
    filter:blur(18px);}
  /* z1 全螢幕地球畫布。用 top/bottom 同時錨定而非固定 height：
     原本 top:-7vh + height:100vh 只到 93vh，底部 7vh 沒有畫布，
     地球與大氣輝光在那裡被切斷而露出空白。
     -14vh~100vh 讓視覺中心維持在 43vh（與原本相同）且完整覆蓋到底。 */
  #globeViz{position:fixed;left:0;right:0;top:-14vh;bottom:0;z-index:1;}
  .glass{background:var(--glass);backdrop-filter:blur(26px) saturate(1.25);-webkit-backdrop-filter:blur(26px) saturate(1.25);
    border:1px solid var(--stroke);box-shadow:var(--gshadow),var(--ghi);}
  /* z20 頂部浮動品牌膠囊 */
  .topbar{position:fixed;z-index:20;top:calc(env(safe-area-inset-top) + 12px);left:14px;
    display:flex;align-items:center;padding:9px 16px;border-radius:999px;}
  .title{font-size:20px;display:flex;align-items:center;line-height:1;white-space:nowrap;}
  .title .en{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;letter-spacing:.03em;
    filter:drop-shadow(0 0 12px rgba(245,166,34,.35));}
  /* 兩個腳印取代 oo：高度對齊 x-height、腳趾略高於字身當作視覺重音 */
  .oo{height:.86em;width:auto;display:block;margin:0 .04em;transform:translateY(.08em);
    filter:drop-shadow(0 0 8px rgba(245,166,34,.35));}
  /* 地球風格切換 */
  .styleSwitch{position:fixed;z-index:20;top:calc(env(safe-area-inset-top) + 12px);right:14px;
    display:flex;gap:2px;padding:4px;border-radius:999px;}
  .ssBtn{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:#78839a;
    display:flex;align-items:center;justify-content:center;padding:0;}
  .ssBtn.active{background:var(--grad);color:#12151f;
    box-shadow:0 0 16px rgba(245,166,34,.45);}
  .ssBtn:active{transform:scale(.92);}
  #empty{position:fixed;z-index:5;left:0;right:0;top:34%;text-align:center;color:#7c879e;font-size:14px;
    line-height:1.9;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.8);}
  /* z40 浮動照片卡 */
  #card{position:fixed;z-index:40;display:none;width:min(78vw,290px);
    background:var(--glass2);backdrop-filter:blur(28px) saturate(1.3);-webkit-backdrop-filter:blur(28px) saturate(1.3);
    border:1px solid var(--stroke);border-radius:24px;padding:12px;
    box-shadow:0 22px 56px rgba(0,0,0,.62),var(--ghi);
    animation:cardPop .3s cubic-bezier(.2,.8,.3,1.15);}
  @keyframes cardPop{from{opacity:0;transform:scale(.9) translateY(10px);}to{opacity:1;}}
  #card .top{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);letter-spacing:.06em;margin:0 2px 9px;}
  #card .top .d{width:7px;height:7px;border-radius:50%;background:#ffb545;flex:none;
    box-shadow:0 0 8px rgba(255,181,69,.8);}
  #card .top .rg{margin-left:auto;color:#ffb545;font-weight:600;letter-spacing:.1em;}
  /* 照片是唯一該飽和的東西——深色底讓它自然跳出 */
  #card img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;display:block;background:#161b28;}
  #card .row{display:flex;align-items:center;gap:9px;margin:11px 4px 3px;}
  #card .flag{font-size:22px;line-height:1;}
  #card .place{font-size:19px;font-weight:700;}
  #card .date{font-size:12px;color:var(--mut);margin:1px 4px 2px;}
  #card .x{position:absolute;top:-9px;right:-9px;width:28px;height:28px;border-radius:50%;
    background:rgba(28,34,50,.92);color:#c3cbdc;border:1px solid var(--stroke);font-size:15px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.55);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  /* z30 底部浮動資訊窗格（可收合） */
  .sheet{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);
    border-radius:22px;padding:8px 14px 12px;}
  #sheetToggle{display:block;width:100%;height:16px;border:0;background:transparent;padding:0;cursor:pointer;}
  #sheetToggle::before{content:"";display:block;width:36px;height:4px;border-radius:2px;
    background:rgba(255,255,255,.22);margin:4px auto;}
  .sheet-body{margin-top:6px;}
  .sheet.collapsed .sheet-body{display:none;}
  .dist{display:flex;align-items:center;gap:14px;}
  #donut{width:84px;height:84px;flex:none;}
  #donut svg{width:100%;height:100%;}
  #donut .dt-num{font-size:30px;font-weight:800;fill:var(--ink);}
  #donut .dt-lbl{font-size:10px;letter-spacing:.12em;fill:var(--mut);}
  .side{flex:1;min-width:0;}
  #legend{display:flex;flex-direction:column;gap:5px;}
  .lg{display:flex;align-items:center;font-size:12.5px;}
  .lg .dot{width:8px;height:8px;border-radius:50%;margin-right:8px;flex:none;}
  .lg .rn{color:var(--ink);opacity:.78;}
  .lg .cn{margin-left:auto;font-weight:700;color:var(--ink);}
  .chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:baseline;gap:5px;font-size:9.5px;color:var(--mut);letter-spacing:.08em;
    background:rgba(255,255,255,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--stroke);border-radius:999px;padding:4px 11px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
  .chip b{color:#ffb545;font-size:14px;font-variant-numeric:tabular-nums;}
  /* 年份時間軸 */
  #years{display:none;gap:6px;overflow-x:auto;padding:2px 2px 9px;scrollbar-width:none;
    border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;}
  #years::-webkit-scrollbar{display:none;}
  .yr{flex:none;font-size:12px;letter-spacing:.04em;color:var(--mut);white-space:nowrap;
    background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:999px;
    padding:5px 13px;font-variant-numeric:tabular-nums;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  .yr b{font-weight:700;color:var(--ink);}
  .yr.on{background:var(--grad);border-color:rgba(255,209,102,.5);color:#12151f;
    box-shadow:0 0 18px rgba(245,166,34,.4);}
  .yr.on b{color:#12151f;}
  .yr:active{transform:scale(.94);}
  /* 橫向照片條 */
  #strip{display:none;gap:8px;margin-top:11px;overflow-x:auto;padding:2px;scrollbar-width:none;}
  #strip::-webkit-scrollbar{display:none;}
  #strip img{width:56px;height:56px;object-fit:cover;border-radius:12px;flex:none;
    border:1px solid rgba(255,255,255,.16);box-shadow:0 4px 14px rgba(0,0,0,.5);}
  #strip img:active{transform:scale(.94);}
  /* 新增照片 FAB（黏在窗格右上角） */
  /* FAB：全畫面唯一的實心暖色——稀缺才有強調力 */
  .fab{position:absolute;top:-24px;right:14px;width:52px;height:52px;border-radius:50%;
    background:var(--grad);color:#12151f;font-size:26px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,209,102,.45);
    box-shadow:0 0 26px rgba(245,166,34,.5),0 10px 24px rgba(0,0,0,.5);
    animation:glow 3.4s ease-in-out infinite;}
  .fab:active{transform:scale(.94);}
  @keyframes glow{0%,100%{box-shadow:0 0 20px rgba(245,166,34,.4),0 10px 24px rgba(0,0,0,.5);}
    50%{box-shadow:0 0 34px rgba(255,190,80,.62),0 10px 24px rgba(0,0,0,.5);}}
  #file{display:none;}
  #toast{position:fixed;z-index:50;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translateX(-50%);
    background:rgba(20,26,40,.9);color:var(--ink);font-size:13px;padding:9px 18px;border-radius:999px;display:none;
    border:1px solid var(--stroke);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 28px rgba(0,0,0,.6);}
</style>
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script src="https://unpkg.com/globe.gl@2.32.0/dist/globe.gl.min.js"></script>
<script src="https://unpkg.com/exifr@7.1.3/dist/full.umd.js"></script>

<body>
<div id="bg"></div>
<div id="stars"></div>
<div id="halo"></div>
<div id="globeViz"></div>

<div class="topbar glass">
  <!-- 字標：footsteps 的兩個 o 換成腳印（o 本來就長得像腳掌） -->
  <div class="title" role="img" aria-label="footsteps">
    <span class="en" aria-hidden="true">f</span>
    <svg class="oo" viewBox="0 0 44 28" aria-hidden="true">
      <defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset=".55" stop-color="#f5a622"/><stop offset="1" stop-color="#e07b2c"/></linearGradient></defs>
      <g fill="url(#fg)">
        <g transform="rotate(-7 11 17)">
          <ellipse cx="11" cy="17.6" rx="6.6" ry="7.3"/>
          <circle cx="5.7" cy="9.9" r="1.7"/><circle cx="9.4" cy="8.1" r="1.95"/><circle cx="13.2" cy="8.2" r="1.85"/><circle cx="16.5" cy="9.9" r="1.6"/>
        </g>
        <g transform="translate(22,0) rotate(7 11 17)">
          <ellipse cx="11" cy="17.6" rx="6.6" ry="7.3"/>
          <circle cx="5.7" cy="9.9" r="1.6"/><circle cx="9.0" cy="8.2" r="1.85"/><circle cx="12.8" cy="8.1" r="1.95"/><circle cx="16.5" cy="9.9" r="1.7"/>
        </g>
      </g>
    </svg>
    <span class="en" aria-hidden="true">tsteps</span>
  </div>
</div>

<div class="styleSwitch glass" id="styleSwitch">
  <button class="ssBtn" data-style="realistic" aria-label="寫實地球">
    <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="currentColor"/></svg>
  </button>
  <button class="ssBtn" data-style="network" aria-label="網絡地球">
    <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">
      <circle cx="10" cy="10" r="7.6"/>
      <path d="M2.6 10h14.8M10 2.4c2.6 2.2 2.6 13 0 15.2M10 2.4c-2.6 2.2-2.6 13 0 15.2"/>
      <circle cx="6.2" cy="6.4" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="13.6" cy="12.4" r="1.5" fill="currentColor" stroke="none"/>
    </svg>
  </button>
  <button class="ssBtn" data-style="particle" aria-label="顆粒地球">
    <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="10" cy="3.2" r="1.7" fill="currentColor"/><circle cx="15.6" cy="6.5" r="1.7" fill="currentColor"/>
      <circle cx="16.5" cy="12.4" r="1.7" fill="currentColor"/><circle cx="12.2" cy="16.6" r="1.7" fill="currentColor"/>
      <circle cx="5.8" cy="15.5" r="1.7" fill="currentColor"/><circle cx="3.4" cy="9.6" r="1.7" fill="currentColor"/>
      <circle cx="9.6" cy="10" r="1.7" fill="currentColor"/>
    </svg>
  </button>
</div>

<div id="empty">按右下「＋」選照片<br>從相簿挑帶定位的照片<br>就會標到地球上</div>

<div id="card">
  <span class="x" id="cardX">✕</span>
  <div class="top"><span class="d"></span><span id="cCoord"></span><span class="rg" id="cRegion"></span></div>
  <img id="cImg">
  <div class="row"><span class="flag" id="cFlag"></span><span class="place" id="cPlace"></span></div>
  <div class="date" id="cDate"></div>
</div>

<div class="sheet glass" id="sheet">
  <button id="sheetToggle" aria-label="收合/展開"></button>
  <div class="sheet-body">
    <div id="years"></div>
    <div class="dist">
      <div id="donut"></div>
      <div class="side">
        <div id="legend"></div>
        <div class="chips">
          <span class="chip"><b id="sCountries">0</b>COUNTRIES</span>
          <span class="chip"><b id="sSince">–</b><span id="sSinceL">YEARS</span></span>
        </div>
      </div>
    </div>
    <div id="strip"></div>
  </div>
  <label class="fab" for="file">＋</label>
  <input id="file" type="file" accept="image/*" multiple>
</div>
<div id="toast"></div>

<script>
// ---- 國碼 → 地區 ----
const R_EAST=['JP','KR','KP','CN','TW','HK','MO','MN'],
 R_SE=['TH','VN','PH','ID','MY','SG','KH','LA','MM','BN','TL'],
 R_SOUTH=['IN','NP','LK','BD','PK','BT','MV','AF'],
 R_WEST=['TR','IL','PS','JO','LB','SY','IQ','IR','SA','AE','QA','BH','KW','OM','YE','GE','AM','AZ','CY'],
 R_CENTRAL=['KZ','UZ','TM','KG','TJ'],
 R_EU=['GB','IE','FR','DE','ES','PT','IT','NL','BE','LU','CH','AT','DK','SE','NO','FI','IS','PL','CZ','SK','HU','RO','BG','GR','HR','SI','RS','BA','ME','MK','AL','EE','LV','LT','UA','BY','MD','RU','MT','MC','VA','LI','AD','SM','XK'],
 R_AM=['US','CA','MX','GT','BZ','SV','HN','NI','CR','PA','CU','DO','JM','HT','BS','PR','TT','BB','CO','VE','EC','PE','BO','CL','AR','UY','PY','BR','GY','SR'],
 R_OC=['AU','NZ','FJ','PG','NC','PF','WS','TO','VU','SB','GU','CK','KI','FM','PW','MH','NR','TV'],
 R_AF=['EG','MA','TN','DZ','LY','ZA','KE','TZ','ET','NG','GH','SN','MU','SC','NA','BW','ZW','ZM','UG','RW','MZ','MG','CI','CM','GA','GM','BJ','TG','ML','BF','NE','SD','SS','SO','ER','DJ','LR','SL','GN','MW','LS','SZ','AO','CG','CD','CF','TD','MR','CV'];
const REGION_MAP={};
[['East Asia',R_EAST],['SE Asia',R_SE],['South Asia',R_SOUTH],['West Asia',R_WEST],['Central Asia',R_CENTRAL],
 ['Europe',R_EU],['Americas',R_AM],['Oceania',R_OC],['Africa',R_AF]].forEach(([r,l])=>l.forEach(c=>REGION_MAP[c]=r));
// 分類色必須用「色相」區分而非明度——原本全是琥珀明度變體，圖例小圓點根本分不出來。
// 深色底讓這些色可以飽和而不刺眼。
const REGION_COLORS={'East Asia':'#ffb545','SE Asia':'#ff7a5c','South Asia':'#ff5c9d','Europe':'#7c9dff',
 'West Asia':'#c88dff','Central Asia':'#5ad1e6','Americas':'#4fd6a8','Africa':'#ffd166','Oceania':'#9aa8c4','Other':'#6b7689'};
const regionOf=cc=>REGION_MAP[cc]||'Other';
const flagOf=cc=>cc&&cc.length===2?cc.toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt())):'🏳️';

// ---- 星空：產生一張小貼圖後鋪滿，比幾百個 DOM 星點輕得多 ----
(function starfield(){
  const S=420,c=document.createElement('canvas');c.width=c.height=S;
  const x=c.getContext('2d');
  for(let i=0;i<200;i++){
    const px=Math.random()*S,py=Math.random()*S;
    const r=Math.random()<0.88?(0.4+Math.random()*0.65):(1.1+Math.random()*0.75);
    const a=(0.14+Math.random()*0.6).toFixed(2);
    const tint=Math.random();
    x.fillStyle=tint<0.7?`rgba(255,255,255,${a})`
      :tint<0.88?`rgba(178,204,255,${a})`:`rgba(255,224,188,${a})`;
    x.beginPath();x.arc(px,py,r,0,7);x.fill();
  }
  const el=document.getElementById('stars');
  if(el)el.style.backgroundImage='url('+c.toDataURL()+')';
})();

// ---- IndexedDB ----
const DB='travelAtlas',ST='pts';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);
 r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){const db=await idb();return new Promise(r=>{const t=db.transaction(ST).objectStore(ST).get(k);t.onsuccess=()=>r(t.result);t.onerror=()=>r(null);});}
async function idbSet(k,v){const db=await idb();return new Promise(r=>{const t=db.transaction(ST,'readwrite').objectStore(ST).put(v,k);t.onsuccess=()=>r();t.onerror=()=>r();});}

// ---- 狀態 ----
let PTS=[];              // {lat,lon,place,country,cc,region,date,thumb,file}
const geoCache={};
function saveData(){return idbSet('data',PTS.map(p=>({lat:p.lat,lon:p.lon,place:p.place,country:p.country,cc:p.cc,region:p.region,date:p.date,thumb:p.thumb,file:p.file})));}

// ---- 地球儀 ----
const world=Globe()(document.getElementById('globeViz'))
 .backgroundColor('rgba(0,0,0,0)')
 .globeImageUrl('./earth-8k.jpg')
 .bumpImageUrl('https://unpkg.com/three-globe@2.31.0/example/img/earth-topology.png')
 .showAtmosphere(true).atmosphereColor('#63a9ff').atmosphereAltitude(0.26)
 .pointLat('lat').pointLng('lon')
 .pointColor(()=> 'rgba(255,77,157,0.7)').pointRadius(0.62)
 .pointAltitude(0.05).pointLabel(d=>d.place||'')
 .pointsMerge(false)
 .onPointHover(d=>{if(d)showCard(d);})
 .onPointClick(d=>showCard(d));
world.globeMaterial().bumpScale=8;

// 顆粒點雲用現有 8K 貼圖取樣陸地/海洋，只在陸地密集撒點、海洋稀疏淡點，
// 讓顆粒呈現真實大陸輪廓；用自訂 shader 讓每個點有獨立大小與顏色。
let globeMeshRef=null;
function getGlobeMesh(){
  if(globeMeshRef)return globeMeshRef;
  // 場景中有多顆 SphereGeometry（隱形輔助球、大氣層 ShaderMaterial、貼圖地球本體）——
  // 只有真正的地球本體帶著 earth-8k 貼圖（material.map），用這個條件精準鎖定，
  // 否則會誤抓到別顆球，導致顆粒模式下寫實地球沒被真的藏起來。
  world.scene().traverse(o=>{
    if(!globeMeshRef&&o.isMesh&&o.geometry&&o.geometry.type==='SphereGeometry'&&o.material&&o.material.map)
      globeMeshRef=o;
  });
  return globeMeshRef;
}
function dotSpriteTexture(){
  const c=document.createElement('canvas');c.width=c.height=32;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.5,'rgba(255,255,255,.65)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.beginPath();x.arc(16,16,16,0,Math.PI*2);x.fill();
  return new THREE.CanvasTexture(c);
}
let particlePoints=null,particleBuilding=null;
function buildParticleGlobe(){
  if(particlePoints)return Promise.resolve(particlePoints);
  if(particleBuilding)return particleBuilding;
  particleBuilding=new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const w=400,h=200,c=document.createElement('canvas');c.width=w;c.height=h;
      const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);
      let data=null;try{data=ctx.getImageData(0,0,w,h).data;}catch(_){}
      resolve(makePoints({w,h,data}));
    };
    img.onerror=()=>resolve(makePoints({w:0,h:0,data:null}));
    img.src='./earth-8k.jpg';
  });
  function makePoints(sampler){
    const R=world.getGlobeRadius()*1.004;
    const N=26000,golden=Math.PI*(3-Math.sqrt(5));
    const positions=[],colors=[],sizes=[],phases=[];
    const sampleAt=(px,py)=>{const i=(py*sampler.w+px)*4;return [sampler.data[i],sampler.data[i+1],sampler.data[i+2]];};
    const isOcean=(r,g,b)=>(b>r+14&&b>g+8);
    for(let i=0;i<N;i++){
      const y=1-(i/(N-1))*2;
      const lat=Math.asin(Math.max(-1,Math.min(1,y)))*180/Math.PI;
      const lon=((i*golden)%(2*Math.PI))*180/Math.PI-180;
      let land=true,lum=0.5,coastal=false,rgb=[128,128,128];
      if(sampler.data){
        let px=Math.floor((lon+180)/360*sampler.w);px=Math.max(0,Math.min(sampler.w-1,px));
        let py=Math.floor((90-lat)/180*sampler.h);py=Math.max(0,Math.min(sampler.h-1,py));
        rgb=sampleAt(px,py);
        land=!isOcean(rgb[0],rgb[1],rgb[2]);
        if(land){
          lum=(0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2])/255;
          // 海岸線偵測：相鄰取樣若是海洋即為岸邊點，放大並染上冷色讓大陸輪廓自我銳利
          for(const [dx,dy] of [[2,0],[-2,0],[0,2],[0,-2]]){
            const nx=Math.max(0,Math.min(sampler.w-1,px+dx)),ny=Math.max(0,Math.min(sampler.h-1,py+dy));
            const s=sampleAt(nx,ny);if(isOcean(s[0],s[1],s[2])){coastal=true;break;}
          }
        }
      }
      const keep=land?Math.random()<0.88:Math.random()<0.07;
      if(!keep)continue;
      const latR=lat*Math.PI/180,lonR=lon*Math.PI/180;
      positions.push(R*Math.cos(latR)*Math.sin(lonR),R*Math.sin(latR),R*Math.cos(latR)*Math.cos(lonR));
      if(land){
        // 地表分類著色：讀貼圖的「色相」而不只是明度，判斷冰雪/植被/乾旱/岩石，
        // 各給一個色相。走克制的和諧色盤（非直接複製衛星照，才與寫實模式有區別）
        const [r,g,b]=rgb;
        const mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=(mx-mn)/255;
        let col,sz;
        if(lum>0.70&&sat<0.17){col=[196,232,255];sz=2.0;}        // 冰雪：格陵蘭、南極、高山
        else if(g>r+4){col=[88,214,155];sz=1.6;}                 // 植被：亞馬遜、西伯利亞、剛果
        else if(lum>0.52){col=[255,201,79];sz=2.0;}              // 乾旱：撒哈拉、阿拉伯、澳洲內陸
        else {col=[224,138,74];sz=1.45;}                         // 岩石/乾草原
        // 明度微調：同類地表仍保有深淺層次
        const k=0.82+0.36*Math.max(0,Math.min(1,(lum-0.2)/0.55));
        let cr=col[0]*k, cg=col[1]*k, cb=col[2]*k;
        sz+=Math.random()*0.3;
        if(coastal){sz*=1.28;cr=cr*0.72+196*0.28;cg=cg*0.72+232*0.28;cb=cb*0.72+255*0.28;}
        const jit=0.95+Math.random()*0.1;
        colors.push(Math.min(1,cr/255*jit),Math.min(1,cg/255*jit),Math.min(1,cb/255*jit));
        sizes.push(sz);
      }else{
        colors.push(72/255,132/255,208/255);   // 海洋：稀疏深藍，只做為底層深度暗示
        sizes.push(0.7+Math.random()*0.45);
      }
      phases.push(Math.random()*6.283);
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
    geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
    geo.setAttribute('size',new THREE.Float32BufferAttribute(sizes,1));
    geo.setAttribute('phase',new THREE.Float32BufferAttribute(phases,1));
    const mat=new THREE.ShaderMaterial({
      uniforms:{pointTexture:{value:dotSpriteTexture()},dpr:{value:Math.min(window.devicePixelRatio||1,3)},uTime:{value:0}},
      // gl_PointSize 以 framebuffer 像素計算，需乘 DPR 才能在 retina 上得到相同視覺大小；
      // 係數 640 = 預設視距(球半徑100、altitude 2.2 → 距離 320)下讓 size 1 約等於 2 CSS px。
      // clamp 避免拉近時單點膨脹成大色塊。
      // 深度衰減：以「點的視空間 z 相對球心」判斷正/背面（球半徑 100），
      // 背面的點縮小變淡，球體輪廓才會銳利、正面資訊才清晰。
      vertexShader:`attribute float size;attribute vec3 color;attribute float phase;
        varying vec3 vColor;varying float vFade;uniform float dpr;uniform float uTime;
        void main(){vColor=color;
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        vec4 cv=modelViewMatrix*vec4(0.0,0.0,0.0,1.0);
        float f=(mv.z-cv.z)/100.0;
        // 微閃爍：每點帶隨機相位的緩慢明暗呼吸，讓表面有生命感
        float tw=0.84+0.16*sin(uTime*1.6+phase);
        vFade=mix(0.14,1.0,smoothstep(-0.55,0.4,f))*tw;
        float sizeFade=mix(0.6,1.0,smoothstep(-0.55,0.4,f));

      fragmentShader:`uniform sampler2D pointTexture;varying vec3 vColor;varying float vFade;
        void main(){vec4 tex=texture2D(pointTexture,gl_PointCoord);
        if(tex.a<0.06)discard;gl_FragColor=vec4(vColor,tex.a*vFade);}`,
      transparent:true,depthWrite:false
    });
    particlePoints=new THREE.Points(geo,mat);
    particlePoints.visible=false;
    world.scene().add(particlePoints);
    return particlePoints;
  }
  return particleBuilding;
}

// 經緯網格：網絡風格用來暗示球體曲率（globe.gl 無內建，用 paths 圖層畫）
function buildGraticule(){
  const paths=[];
  for(let lon=-180;lon<180;lon+=30){
    const p=[];for(let lat=-80;lat<=80;lat+=4)p.push([lat,lon]);paths.push(p);
  }
  for(let lat=-60;lat<=60;lat+=30){
    const p=[];for(let lon=-180;lon<=180;lon+=4)p.push([lat,lon]);paths.push(p);
  }
  return paths;
}

    _lodState='';   // 重新評估精細度（可能已在放大狀態，需直接載入州省級）
    loadBorders().then(b=>{if(globeStyle==='network'&&_lodState!=='fine')world.polygonsData(b);});
  }else{
    if(mesh){mesh.visible=true;restoreGlobe();}
    if(particlePoints)particlePoints.visible=false;
    world.showAtmosphere(true);
    world.polygonsData([]);
    world.pathsData([]);
  }
}
document.querySelectorAll('.ssBtn').forEach(b=>b.addEventListener('click',()=>applyGlobeStyle(b.dataset.style)));
applyGlobeStyle(globeStyle);

// ---- 年份篩選 ----
let yearFilter='all';
function visiblePts(){
  return yearFilter==='all'?PTS:PTS.filter(p=>p.date&&p.date.slice(0,4)===yearFilter);
}
// ---- 旅程連線：依時間順序把足跡連成弧線 ----
function buildArcs(pts){
  const seq=pts.filter(p=>p.date).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const arcs=[];
  for(let i=0;i<seq.length-1;i++){
    const a=seq[i],b=seq[i+1];
    // 同地點（<25km）不連線，避免同城市照片間出現一堆碎弧
    const dLat=(b.lat-a.lat)*111, dLon=(b.lon-a.lon)*111*Math.cos(a.lat*Math.PI/180);
    if(Math.hypot(dLat,dLon)<25)continue;
    arcs.push({sLat:a.lat,sLng:a.lon,eLat:b.lat,eLng:b.lon});
  }
  return arcs;
}
function refresh(){
  const vis=visiblePts();
  world.pointsData(vis.slice());
  world.ringsData(vis.slice());
  world.arcsData(buildArcs(vis));
  document.getElementById('empty').style.display=PTS.length?'none':'block';
  renderYears();renderStats(vis);renderDonut(vis);renderStrip(vis);
}
// 年份籤：ALL + 各年份，點擊只顯示該年的足跡與旅程
function renderYears(){
  const el=document.getElementById('years');
  const cnt={};PTS.forEach(p=>{if(p.date){const y=p.date.slice(0,4);cnt[y]=(cnt[y]||0)+1;}});
  const ys=Object.keys(cnt).sort();
  if(ys.length<2){el.style.display='none';yearFilter='all';return;}   // 只有一年就不顯示
  el.style.display='flex';
  el.innerHTML=`<button class="yr${yearFilter==='all'?' on':''}" data-y="all">ALL <b>${PTS.length}</b></button>`+
    ys.map(y=>`<button class="yr${yearFilter===y?' on':''}" data-y="${y}">${y} <b>${cnt[y]}</b></button>`).join('');
  [...el.children].forEach(b=>b.onclick=()=>{
    yearFilter=b.dataset.y;
    card.style.display='none';CARD_PT=null;      // 篩選後原本開著的卡片可能已不在範圍
    refresh();
    const v=visiblePts();
    if(v.length)world.pointOfView({lat:v[0].lat,lng:v[0].lon,altitude:viewAltitude(2.2)},900);
  });
}
function renderStats(vis){
  vis=vis||visiblePts();
  document.getElementById('sCountries').textContent=new Set(vis.map(p=>p.cc).filter(Boolean)).size;
  const ys=vis.map(p=>p.date&&+p.date.slice(0,4)).filter(Boolean);
  const el=document.getElementById('sSince');
  if(ys.length){const m=Math.min(...ys);el.textContent=(new Date().getFullYear()-m+1);
    document.getElementById('sSinceL').textContent='YEARS · SINCE '+m;}
  else{el.textContent='–';document.getElementById('sSinceL').textContent='YEARS';}
}
// 橫向照片條：最新在前，點縮圖飛到該足跡並開卡片
function renderStrip(vis){
  vis=vis||visiblePts();
  const s=document.getElementById('strip');
  if(!vis.length){s.style.display='none';return;}
  s.style.display='flex';
  const rev=vis.slice().reverse();
  s.innerHTML=rev.map(p=>`<img src="${p.thumb}" alt="${p.place||''}">`).join('');
  [...s.children].forEach((img,i)=>img.onclick=()=>{const p=rev[i];
    world.pointOfView({lat:p.lat,lng:p.lon,altitude:0.35},1200);showCard(p);});
}
document.getElementById('sheetToggle').onclick=()=>document.getElementById('sheet').classList.toggle('collapsed');
function renderDonut(vis){
  vis=vis||visiblePts();
  const c={};vis.forEach(p=>{const r=p.region||'Other';c[r]=(c[r]||0)+1;});
  const ent=Object.entries(c).sort((a,b)=>b[1]-a[1]);const total=vis.length||1;
  const C=2*Math.PI*52;let off=0,ring='';
  ent.forEach(([r,n])=>{const len=n/total*C;
    ring+=`<circle cx="60" cy="60" r="52" fill="none" stroke="${REGION_COLORS[r]||'#c6cfcc'}" stroke-width="15" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)" stroke-linecap="butt"/>`;off+=len;});
  document.getElementById('donut').innerHTML=`<svg viewBox="0 0 120 120">${ring}<text x="60" y="58" text-anchor="middle" class="dt-num">${vis.length}</text><text x="60" y="74" text-anchor="middle" class="dt-lbl">FOOTPRINTS</text></svg>`;
  document.getElementById('legend').innerHTML=ent.length?ent.map(([r,n])=>`<div class="lg"><span class="dot" style="background:${REGION_COLORS[r]||'#c6cfcc'}"></span><span class="rn">${r}</span><span class="cn">${n}</span></div>`).join(''):`<div class="lg"><span class="rn" style="color:var(--mut)">尚無資料</span></div>`;
}

// ---- 讀照片 ----
const toast=document.getElementById('toast');
const showToast=t=>{toast.textContent=t;toast.style.display='block';};
const hideToast=()=>toast.style.display='none';
document.getElementById('file').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  let added=0,noGps=0;
  for(let i=0;i<files.length;i++){
    showToast(`讀取中 ${i+1}/${files.length}…（已加 ${added}）`);
    const f=files[i];let gps=null,date='';
    try{gps=await exifr.gps(f);}catch(_){}
    if(!gps||gps.latitude==null){noGps++;continue;}
    try{const m=await exifr.parse(f,['DateTimeOriginal','CreateDate','DateTime']);
      const dt=m&&(m.DateTimeOriginal||m.CreateDate||m.DateTime);if(dt)date=new Date(dt).toISOString().slice(0,10);}catch(_){}
    if(!date&&f.lastModified)date=new Date(f.lastModified).toISOString().slice(0,10);
    let thumb='';try{thumb=await makeThumb(f);}catch(_){}
    const p={lat:gps.latitude,lon:gps.longitude,place:'',country:'',cc:'',region:'',date,thumb,file:f.name};
    PTS.push(p);added++;refresh();enqueueGeo(p);
  }
  PTS.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  refresh();await saveData();
  showToast(`完成：新增 ${added}，${noGps} 張無定位`);setTimeout(hideToast,2600);
  if(added&&PTS.length===added)world.pointOfView({lat:PTS[0].lat,lng:PTS[0].lon,altitude:viewAltitude(2.3)},1400);
});
function makeThumb(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const S=320,c=document.createElement('canvas');
    const ar=img.width/img.height;let w=S,h=Math.round(S/ar);if(h<S*0.62){h=Math.round(S*0.62);}
    c.width=S;c.height=Math.round(S*0.62);
    const scale=Math.max(c.width/img.width,c.height/img.height);
    const dw=img.width*scale,dh=img.height*scale;
    c.getContext('2d').drawImage(img,(c.width-dw)/2,(c.height-dh)/2,dw,dh);
    URL.revokeObjectURL(url);try{res(c.toDataURL('image/jpeg',0.74));}catch(e){rej(e);}};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'));};img.src=url;});}

// ---- 地名反查佇列 ----
const geoQ=[];let geoBusy=false;
function enqueueGeo(p){if(!p.cc){geoQ.push(p);pumpGeo();}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function pumpGeo(){if(geoBusy)return;geoBusy=true;
  while(geoQ.length){const p=geoQ.shift();const key=p.lat.toFixed(3)+','+p.lon.toFixed(3);
    let g=geoCache[key];
    if(!g){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${p.lat}&lon=${p.lon}&format=json&zoom=10&accept-language=zh-TW`);
        const j=await r.json();const a=j.address||{};
        g={city:a.city||a.town||a.village||a.county||a.state||'',country:a.country||'',cc:(a.country_code||'').toUpperCase()};
        geoCache[key]=g;}catch(_){g=null;}await sleep(1100);}
    if(g){p.place=g.city;p.country=g.country;p.cc=g.cc;p.region=regionOf(g.cc);
      const vis=visiblePts();
      renderStats(vis);renderDonut(vis);world.pointsData(vis.slice());
      if(CARD_PT===p)fillCard(p);}
  }
  geoBusy=false;saveData();
}

// ---- 卡片 ----
const card=document.getElementById('card');let CARD_PT=null;
document.getElementById('cardX').onclick=()=>{card.style.display='none';CARD_PT=null;};
function fillCard(d){
  document.getElementById('cImg').src=d.thumb||'';
  document.getElementById('cCoord').textContent=`${d.lat.toFixed(2)}°, ${d.lon.toFixed(2)}°`;
  document.getElementById('cRegion').textContent=(d.region&&d.region!=='Other'?d.region:'').toUpperCase();
  document.getElementById('cFlag').textContent=flagOf(d.cc);
  document.getElementById('cPlace').textContent=d.place||'定位中…';
  document.getElementById('cDate').textContent=d.date?d.date.slice(0,7).replace('-','.'):'';
}
function showCard(d){CARD_PT=d;fillCard(d);card.style.display='block';
  card.style.left=(innerWidth-card.offsetWidth)/2+'px';
  card.style.top=Math.max(70,innerHeight*0.40-card.offsetHeight/2)+'px';
  if(!d.cc)enqueueGeo(d);
}

// ---- 啟動 ----
(async()=>{const s=await idbGet('data');
  // 初始視角必須等版面尺寸確定後再套用，否則 viewAltitude 換算不到正確比例；
  // 容器尚未有尺寸時持續重試（rAF 在背景分頁不會執行，故用 setTimeout）
  const setView=(pov,n)=>{
    const el=document.getElementById('globeViz');
    if(el.clientHeight>0){sizeGlobe();world.pointOfView(pov(),0);}
    else if((n||0)<40)setTimeout(()=>setView(pov,(n||0)+1),80);
  };
  if(Array.isArray(s)&&s.length){PTS=s;refresh();
    setView(()=>({lat:PTS[0].lat,lng:PTS[0].lon,altitude:viewAltitude(2.3)}));
    PTS.forEach(p=>{if(!p.cc)enqueueGeo(p);});}
  else {refresh();setView(()=>({altitude:viewAltitude(2.3)}));}})();
</script>
